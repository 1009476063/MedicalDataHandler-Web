<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedVista</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14b8a6" />
  <!-- Use Chinese-accessible font mirrors -->
  <link rel="preconnect" href="https://fonts.loli.net" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Loading screen - shows while Vue initializes */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #app-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loader-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #e2e8f0;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      margin-top: 16px;
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      color: #64748b;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Loading indicator - removed by Vue when mounted -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading MedVista...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
